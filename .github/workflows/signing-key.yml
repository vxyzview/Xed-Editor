name: Generate Signing Key

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate xyzterm.keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore /tmp/xyzterm.keystore \
            -alias xyzterm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
          cat > /tmp/signing.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=xyzterm
          storeFile=/tmp/xyzterm.keystore
          EOF
          base64 -w0 /tmp/xyzterm.keystore > /tmp/xyzterm.keystore.b64
          base64 -w0 /tmp/signing.properties > /tmp/signing.properties.b64
          echo "PASS=$PASS" >> $GITHUB_ENV

      - name: Print secrets to copy
        run: |
          echo "=============== COPY INTO SECRET: KEYSTORE ==============="
          cat /tmp/xyzterm.keystore.b64
          echo ""
          echo "=============== COPY INTO SECRET: PROP ==============="
          cat /tmp/signing.properties.b64
          echo ""
          echo "========================================================="
          echo "Alias: xyzterm"
          echo "Store password: $PASS"
          echo "Key password:   $PASS"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v7
        with:
          name: xyzterm-keystore
          path: |
            /tmp/xyzterm.keystore
            /tmp/signing.properties
          if-no-files-found: error
