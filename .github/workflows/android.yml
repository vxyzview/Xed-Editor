name: Android CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode and create secrets
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > /tmp/xyzterm.keystore
          echo "${{ secrets.PROP }}" | base64 -d > /tmp/signing.properties

      - name: Verify signing key matches properties
        run: |
          if [ ! -s /tmp/xyzterm.keystore ] || [ ! -s /tmp/signing.properties ]; then
            echo "::error::KEYSTORE or PROP secret is missing/empty. Run the 'Generate Signing Key' workflow and paste the printed base64 values into both secrets."
            exit 1
          fi
          STORE_PASS=$(grep '^storePassword=' /tmp/signing.properties | cut -d= -f2)
          KEY_PASS=$(grep '^keyPassword=' /tmp/signing.properties | cut -d= -f2)
          KEY_ALIAS=$(grep '^keyAlias=' /tmp/signing.properties | cut -d= -f2)
          echo "keystore size: $(wc -c < /tmp/xyzterm.keystore) bytes"
          echo "keyAlias=$KEY_ALIAS  storePassword set: $([ -n "$STORE_PASS" ] && echo yes || echo NO)"
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::PROP secret is malformed (missing storePassword/keyPassword/keyAlias). Re-run 'Generate Signing Key' and copy the full PROP base64 block."
            exit 1
          fi
          if ! file /tmp/xyzterm.keystore | grep -qE 'PKCS|Java KeyStore'; then
            echo "::error::KEYSTORE secret is not a valid keystore (base64 corrupted or truncated). Re-run 'Generate Signing Key' and copy the full KEYSTORE base64 block."
            exit 1
          fi
          # Try listing all aliases with the PROP store password
          ALIASES=$(keytool -list -keystore /tmp/xyzterm.keystore -storepass "$STORE_PASS" 2>/dev/null | grep -E '^\s*[a-zA-Z0-9_]+, ' | sed 's/,.*//' | tr -d ' ' | tr '\n' ' ')
          if [ -z "$ALIASES" ]; then
            echo "::error::Keystore cannot be opened with the storePassword from PROP. The two secrets are from DIFFERENT 'Generate Signing Key' runs, or one is stale. Copy both base64 blocks from the SAME run."
            exit 1
          fi
          echo "aliases in keystore: $ALIASES"
          if ! keytool -list -keystore /tmp/xyzterm.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::alias '$KEY_ALIAS' not found in keystore (found: $ALIASES). Copy both secrets from the SAME run."
            exit 1
          fi
          echo "Signing key OK (alias=$KEY_ALIAS)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Clone submodules
        run: git submodule update --init --recursive

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon && mv app/build/outputs/apk/release/*.apk app/xyzterm-${{ env.COMMIT_HASH }}.apk
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: xyzterm-Release
          path: app/xyzterm-${{ env.COMMIT_HASH }}.apk

      - name: Upload APK to PixelDrain
        if: ${{ success() && github.event.head_commit.message != '' }}
        timeout-minutes: 15
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          RESP=$(curl -s -T "app/xyzterm-${{ env.COMMIT_HASH }}.apk" \
            -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/file/")
          echo "PixelDrain response: $RESP"
          ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -n "$ID" ]; then
            echo "APK uploaded: https://pixeldrain.com/u/$ID"
            echo "Commit: $COMMIT_MSG"
          else
            echo "Upload failed: $RESP" >&2
            exit 1
          fi

      - name: Generate Plugin Sdk
        run: |
          bash plugin-sdk/build-auto.sh

      - name: Update Release
        if: ${{ hashFiles('plugin-sdk/output/sdk.jar') != '' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "plugin-sdk/output/sdk.jar"
          tag: "sdk-latest"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          name: "Latest Plugin SDK Build"
          body: "This release is automatically updated with the latest sdk.jar."
          token: ${{ secrets.GITHUB_TOKEN }}
