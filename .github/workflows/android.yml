name: Android CI

# VERSION: 2 - auto-generates signing key; no KEYSTORE/PROP secrets needed.
# If a run log shows "KEYSTORE secret is not a valid keystore" or "Verify signing
# key", it is using a STALE cached workflow - re-run on this commit.

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate signing key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore /tmp/xyzterm.keystore \
            -alias xyzterm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
          cat > /tmp/signing.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=xyzterm
          storeFile=/tmp/xyzterm.keystore
          EOF
          echo "Generated fresh signing key (alias=xyzterm, store=$PASS)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Clone submodules
        run: git submodule update --init --recursive

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon && mv app/build/outputs/apk/release/*.apk app/xyzterm-${{ env.COMMIT_HASH }}.apk
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: xyzterm-Release
          path: app/xyzterm-${{ env.COMMIT_HASH }}.apk

      - name: Upload APK to PixelDrain
        if: ${{ success() && github.event.head_commit.message != '' }}
        timeout-minutes: 15
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          RESP=$(curl -s -T "app/xyzterm-${{ env.COMMIT_HASH }}.apk" \
            -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/file/")
          echo "PixelDrain response: $RESP"
          ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -n "$ID" ]; then
            echo "APK uploaded: https://pixeldrain.com/u/$ID"
            echo "Commit: $COMMIT_MSG"
          else
            echo "Upload failed: $RESP" >&2
            exit 1
          fi

      - name: Generate Plugin Sdk
        run: |
          bash plugin-sdk/build-auto.sh

      - name: Update Release
        if: ${{ hashFiles('plugin-sdk/output/sdk.jar') != '' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "plugin-sdk/output/sdk.jar"
          tag: "sdk-latest"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          name: "Latest Plugin SDK Build"
          body: "This release is automatically updated with the latest sdk.jar."
          token: ${{ secrets.GITHUB_TOKEN }}
